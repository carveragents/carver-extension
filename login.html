<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carver Agents - Login</title>
    <link rel="stylesheet" href="styles/sidepanel.css">
    <style>
        .auth-tabs {
            display: flex;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 24px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px 16px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #6b7280;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .auth-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .auth-tab:hover {
            color: #4f46e5;
        }

        .auth-content {
            display: none;
        }

        .auth-content.active {
            display: block;
        }

        .oauth-button {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            margin-bottom: 12px;
        }

        .oauth-button:hover {
            background: #f9fafb;
            border-color: #9ca3af;
        }

        .oauth-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .oauth-button.google {
            color: #1f2937;
        }

        .oauth-button.microsoft {
            color: #0078d4;
            border-color: #0078d4;
        }

        .oauth-button.microsoft:hover {
            background: #f0f8ff;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
            color: #6b7280;
            font-size: 12px;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e5e7eb;
            z-index: 1;
        }

        .divider span {
            background: white;
            padding: 0 12px;
            position: relative;
            z-index: 2;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .auth-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .auth-success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .forgot-password {
            text-align: center;
            margin-top: 16px;
        }

        .forgot-password a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .loading-spinner-small {
            width: 16px;
            height: 16px;
            border: 2px solid #f3f4f6;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="screen">
            <div class="login-container">
                <div class="login-header">
                    <img src="icons/icon32.svg" alt="Carver Agents" class="login-logo">
                    <h1 class="login-brand">Carver Agents</h1>
                    <p class="login-subtitle">Real-time Contextual Intelligence<br />Anytime, Anywhere</p>
                </div>

                <div class="login-form">
                    <!-- Auth Tabs -->
                    <div class="auth-tabs">
                        <button class="auth-tab active" data-tab="signin">Sign In</button>
                        <button class="auth-tab" data-tab="signup">Create Account</button>
                    </div>

                    <!-- Error/Success Messages -->
                    <div id="auth-error" class="auth-error hidden"></div>
                    <div id="auth-success" class="auth-success hidden"></div>

                    <!-- Sign In Content -->
                    <div id="signin-content" class="auth-content active">
                        <!-- OAuth Buttons -->
                        <button id="google-signin-btn" class="oauth-button google">
                            <svg width="18" height="18" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                            </svg>
                            <span>Continue with Google</span>
                            <div class="loading-spinner-small hidden"></div>
                        </button>

                        <button id="microsoft-signin-btn" class="oauth-button microsoft">
                            <svg width="18" height="18" viewBox="0 0 24 24">
                                <path fill="#0078d4" d="M11.4 24H0V12.6h11.4V24zM24 24H12.6V12.6H24V24zM11.4 11.4H0V0h11.4v11.4zM24 11.4H12.6V0H24v11.4z"/>
                            </svg>
                            <span>Continue with Microsoft</span>
                            <div class="loading-spinner-small hidden"></div>
                        </button>

                        <button id="external-signin-btn" class="oauth-button" style="background: #f8f9fa; color: #5f6368; border-color: #dadce0;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                <path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.11 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z" fill="#5f6368"/>
                            </svg>
                            <span>Sign in on Web (Recommended)</span>
                        </button>

                        <button id="check-existing-auth-btn" class="oauth-button" style="background: #e8f5e8; color: #2d5016; border-color: #4caf50;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="#4caf50"/>
                            </svg>
                            <span>Check if Already Logged In</span>
                            <div class="loading-spinner-small hidden"></div>
                        </button>

                        <div class="divider">
                            <span>or</span>
                        </div>

                        <!-- Email/Password Form -->
                        <form id="signin-form">
                            <div class="form-group">
                                <label for="signin-email">Email</label>
                                <input type="email" id="signin-email" required>
                            </div>

                            <div class="form-group">
                                <label for="signin-password">Password</label>
                                <input type="password" id="signin-password" required>
                            </div>

                            <button type="submit" id="signin-submit-btn" class="btn btn-primary login-btn">
                                <span class="btn-text">Sign In</span>
                                <div class="btn-spinner hidden"></div>
                            </button>
                        </form>

                        <div class="forgot-password">
                            <a href="https://staging.carveragents.ai/forgot-password" target="_blank">Forgot your password?</a>
                        </div>
                    </div>

                    <!-- Sign Up Content -->
                    <div id="signup-content" class="auth-content">
                        <!-- OAuth Buttons -->
                        <button id="google-signup-btn" class="oauth-button google">
                            <svg width="18" height="18" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                            </svg>
                            <span>Sign up with Google</span>
                            <div class="loading-spinner-small hidden"></div>
                        </button>

                        <button id="microsoft-signup-btn" class="oauth-button microsoft">
                            <svg width="18" height="18" viewBox="0 0 24 24">
                                <path fill="#0078d4" d="M11.4 24H0V12.6h11.4V24zM24 24H12.6V12.6H24V24zM11.4 11.4H0V0h11.4v11.4zM24 11.4H12.6V0H24v11.4z"/>
                            </svg>
                            <span>Sign up with Microsoft</span>
                            <div class="loading-spinner-small hidden"></div>
                        </button>

                        <div class="divider">
                            <span>or</span>
                        </div>

                        <!-- Email/Password Form -->
                        <form id="signup-form">
                            <div class="form-group">
                                <label for="signup-name">Full Name</label>
                                <input type="text" id="signup-name" required>
                            </div>

                            <div class="form-group">
                                <label for="signup-email">Email</label>
                                <input type="email" id="signup-email" required>
                            </div>

                            <div class="form-group">
                                <label for="signup-password">Password</label>
                                <input type="password" id="signup-password" required minlength="8">
                            </div>

                            <div class="form-group">
                                <label for="signup-confirm-password">Confirm Password</label>
                                <input type="password" id="signup-confirm-password" required minlength="8">
                            </div>

                            <button type="submit" id="signup-submit-btn" class="btn btn-primary login-btn">
                                <span class="btn-text">Create Account</span>
                                <div class="btn-spinner hidden"></div>
                            </button>
                        </form>
                    </div>

                    <!-- Hidden environment selector -->
                    <select id="host-select" style="display: none;">
                        <option value="https://app.carveragents.ai">Production (app.carveragents.ai)</option>
                        <option value="https://staging.carveragents.ai">Staging (staging.carveragents.ai)</option>
                        <option value="http://localhost:8000">Local Development (localhost:8000)</option>
                    </select>
                </div>

                <div class="login-footer">
                    <p class="footer-text">
                        By logging in, you acknowledge that you have read and understood, and agree to
                        Carver Agents' <a href="https://carveragents.ai/terms-and-conditions" target="_blank">Terms</a> and <a href="https://carveragents.ai/privacy-policy" target="_blank">Privacy Policy</a>.
                    </p>
                    <p class="website-link">
                        <a href="https://carveragents.ai" target="_blank" rel="noopener noreferrer">Visit our website</a>
                    </p>
                    <p class="version-text">
                        © Carver Agents Beta-<span id="api-version"></span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/version.js"></script>
    <script src="js/config.js"></script>
    <script src="js/web-auth-bridge.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
